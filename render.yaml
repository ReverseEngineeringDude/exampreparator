services:
  - type: web
    name: my-flask-app
    env: python
    buildCommand: |
      python -m venv venv
      . venv/bin/activate
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      . venv/bin/activate
      cd backend && flask run --host=0.0.0.0 --port=$PORT

