<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Mermaid.js for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #131314;
            /* Gemini dark background */
            color: #e3e3e3;
        }

        /* Smooth Accordion Animation */
        .answer-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .answer-wrapper.open {
            grid-template-rows: 1fr;
        }

        .answer-inner {
            overflow: hidden;
        }

        /* Staggered Item Entrance */
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .qa-item {
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Gemini Gradient Text */
        .gemini-gradient {
            background: linear-gradient(74deg, #4285f4 0, #9b72cb 9%, #d96570 20%, #d96570 24%, #9b72cb 35%, #4285f4 44%, #9b72cb 50%, #d96570 56%, #131314 75%, #131314 100%);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gemini-border-active {
            position: relative;
        }

        .gemini-border-active::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(to right, #4285f4, #d96570);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: source-out;
            mask-composite: exclude;
            opacity: 0.5;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #131314;
        }

        ::-webkit-scrollbar-thumb {
            background: #333537;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a4d51;
        }

        /* Mermaid Diagram Styling */
        .mermaid,
        .language-mermaid {
            display: flex;
            justify-content: center;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            width: 100%;
            overflow-x: auto;
        }

        .mermaid svg {
            max-width: 100%;
            height: auto;
        }

        .loading-anim {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }
    </style>
</head>

<body class="min-h-screen p-4 sm:p-8 antialiased">
    <script>mermaid.initialize({ startOnLoad: false, theme: 'default' });</script>

    <div class="max-w-4xl mx-auto flex flex-col h-full mt-4 sm:mt-10 relative">
        <a href="/"
            class="absolute -top-10 left-0 text-gray-400 hover:text-white flex items-center gap-2 transition-colors inline-block mb-4"
            style="text-decoration: none;">
            <i class="ph-bold ph-arrow-left"></i> Home
        </a>

        <!-- Header & Filters -->
        <div
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10 gap-6 border-b border-[#333537] pb-6">

            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-full bg-[#1e1f20] border border-[#333537] flex items-center justify-center">
                    <i class="ph-fill ph-sparkle text-xl text-blue-400"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-semibold tracking-tight">Study<span
                            class="gemini-gradient ml-1">Assistant</span></h1>
                    <p id="page-subtitle" class="text-sm text-gray-400 mt-0.5">Fetching insights...</p>
                </div>
            </div>

            <!-- Filters (Only for Q&A mode, initially hidden) -->
            <div id="filters-container" style="display: none;"
                class="flex items-center gap-2 bg-[#1e1f20] p-1.5 rounded-full border border-[#333537] shadow-lg shrink-0 overflow-x-auto max-w-full">
                <!-- Dynamically populated or static 'All' -->
                <button
                    class="filter-btn active px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 bg-[#333537] text-white shadow-sm"
                    data-mark="all">
                    All Questions
                </button>
            </div>

        </div>

        <!-- Loading State -->
        <div id="loading-state" class="text-center py-20">
            <i class="ph-bold ph-spinner-gap text-4xl text-blue-500 animate-spin mb-4 block mx-auto"></i>
            <p class="text-gray-400 loading-anim">Retrieving AI generated insights...</p>
        </div>

        <!-- Q&A List Container -->
        <div id="qa-container" class="flex flex-col gap-4 pb-20" style="display: none;">
            <!-- Questions will be dynamically injected here -->
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'qb';

        const container = document.getElementById('qa-container');
        const loadingState = document.getElementById('loading-state');
        const subtitle = document.getElementById('page-subtitle');
        const filtersContainer = document.getElementById('filters-container');

        let fetchedData = [];

        async function init() {
            if (mode === 'qb') {
                subtitle.textContent = "Answers extracted from your notes.";
                await fetchQAData();
            } else {
                subtitle.textContent = "High-yield topics and summaries.";
                await fetchStudyData();
            }
        }

        async function fetchQAData() {
            try {
                const response = await fetch('/get_answers');
                if (!response.ok) throw new Error("Failed to load answers");

                // Now expecting a JSON array from the backend instead of a markdown dump string
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                if (!Array.isArray(data)) {
                    if (typeof data === 'string') {
                        throw new Error(data);
                    }
                    throw new Error("Invalid answers format received from backend.");
                }

                fetchedData = [];
                const uniqueMarks = new Set(); // Store unique marks for filtering

                data.forEach((item, idx) => {
                    const markDisplay = item.mark; // e.g. "5 Marks" or "Unmarked"
                    uniqueMarks.add(markDisplay);

                    fetchedData.push({
                        id: item.id || idx,
                        mark: markDisplay,
                        topic: item.topic,
                        answerHtml: marked.parse(item.answerHtmlMarkdown),
                        rawMark: item.rawMark // Store raw string for filtering/sorting
                    });
                });

                // Render Filter Buttons
                const filtersContainer = document.getElementById('filters-container');
                filtersContainer.innerHTML = ''; // Clear existing
                filtersContainer.style.display = 'flex';

                // Add "All" button
                const allBtn = document.createElement('button');
                allBtn.className = 'filter-btn active px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 bg-blue-600 text-white shadow-[0_0_15px_rgba(37,99,235,0.4)] border border-blue-500';
                allBtn.textContent = 'All Questions';
                allBtn.dataset.mark = 'all';
                filtersContainer.appendChild(allBtn);

                // Add unique mark buttons sorted (try to parse int if possible)
                const sortedMarks = Array.from(uniqueMarks).sort((a, b) => {
                    let aInt = parseInt(a);
                    let bInt = parseInt(b);
                    if (!isNaN(aInt) && !isNaN(bInt)) return aInt - bInt;
                    return a.localeCompare(b);
                });

                sortedMarks.forEach(mark => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn px-5 py-2 rounded-full text-sm font-medium transition-all duration-300 bg-[#333537] text-gray-300 border border-[#4a4d51] hover:bg-[#4a4d51] hover:text-white';
                    btn.textContent = mark;
                    btn.dataset.mark = mark;
                    filtersContainer.appendChild(btn);
                });

                // Setup Filter Listeners
                setupFilterListeners();

                renderResult(fetchedData);
            } catch (err) {
                showError(err.message);
            }
        }

        function setupFilterListeners() {
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update active styles
                    btns.forEach(b => {
                        b.classList.remove('active', 'bg-blue-600', 'text-white', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]', 'border-blue-500');
                        b.classList.add('bg-[#333537]', 'text-gray-300', 'border-[#4a4d51]');
                    });

                    btn.classList.add('active', 'bg-blue-600', 'text-white', 'shadow-[0_0_15px_rgba(37,99,235,0.4)]', 'border-blue-500');
                    btn.classList.remove('bg-[#333537]', 'text-gray-300', 'border-[#4a4d51]');

                    // Filter Logic
                    const selectedMark = btn.dataset.mark;
                    const items = document.querySelectorAll('.qa-item');

                    items.forEach(item => {
                        if (selectedMark === 'all') {
                            item.style.display = 'block';
                            // Restart animation for effect
                            item.style.animation = 'none';
                            item.offsetHeight; /* trigger reflow */
                            item.style.animation = null;
                        } else {
                            if (item.dataset.mark === selectedMark || item.dataset.rawmark === selectedMark) {
                                item.style.display = 'block';
                                item.style.animation = 'none';
                                item.offsetHeight;
                                item.style.animation = null;
                            } else {
                                item.style.display = 'none';
                            }
                        }
                    });
                });
            });
        }

        async function fetchStudyData() {
            try {
                const response = await fetch('/get_study_material');
                if (!response.ok) throw new Error("Failed to load study material");
                const json = await response.json();

                fetchedData = json.map((item, idx) => {
                    let pointsHtml = '<ul class="list-disc pl-5 space-y-2 mt-4 text-gray-300">';
                    item.points.forEach(p => pointsHtml += `<li>${p}</li>`);
                    pointsHtml += '</ul>';

                    let diagramHtml = '';
                    if (item.diagram) {
                        diagramHtml = `<div class="mermaid mt-4">${item.diagram}</div>`;
                    }

                    let videoHtml = `
                     <div class="mt-6">
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(item.topic + ' tutorial')}" 
                           target="_blank"
                           class="inline-flex items-center gap-2 bg-[#ff0000]/10 text-[#ff4444] px-4 py-2 rounded-lg hover:bg-[#ff0000]/20 transition-colors text-sm font-semibold"
                           style="position: relative; z-index: 10; pointer-events: all;"
                           onclick="event.stopPropagation();">
                           <i class="ph-fill ph-youtube-logo text-lg" style="pointer-events:none;"></i> Watch Tutorials on YouTube
                        </a>
                     </div>
                     `;

                    let answerHtml = `
                        <div class="text-base text-gray-200">${item.summary}</div>
                        ${pointsHtml}
                        ${diagramHtml}
                        ${videoHtml}
                     `;

                    return {
                        id: idx,
                        mark: 'Topic',
                        topic: item.topic,
                        answerHtml: answerHtml
                    };
                });

                renderResult(fetchedData);
            } catch (err) {
                showError(err.message);
            }
        }

        function showError(msg) {
            loadingState.style.display = 'none';
            container.style.display = 'block';

            if (msg && msg.includes("API Rate Limit Exceeded")) {
                container.innerHTML = `
                <div class="text-center text-orange-400 py-10 bg-orange-500/10 border border-orange-500/20 rounded-xl flex flex-col items-center justify-center gap-4">
                    <i class="ph-bold ph-warning-circle text-4xl"></i>
                    <div>
                        <h3 class="text-lg font-bold">API Rate Limit Exceeded</h3>
                        <p class="text-gray-400 text-sm mt-1">You have exhausted your free tier quota.</p>
                        <p class="text-white font-mono mt-3 text-lg bg-[#1e1f20] px-4 py-2 rounded-lg border border-[#333537]">
                            Try again in: <span id="quota-countdown">60</span>s
                        </p>
                    </div>
                </div>`;

                let timeLeft = 60;
                const timerSpan = document.getElementById('quota-countdown');
                const interval = setInterval(() => {
                    timeLeft--;
                    if (timerSpan) timerSpan.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(interval);
                        if (timerSpan) {
                            timerSpan.parentElement.innerHTML = '<button onclick="window.location.reload()" class="text-blue-400 hover:text-blue-300 underline font-sans">Refresh & Try Again</button>';
                        }
                    }
                }, 1000);
            } else {
                container.innerHTML = `<div class="text-center text-red-500 py-10 bg-red-500/10 border border-red-500/20 rounded-xl">❌ Error: ${msg}</div>`;
            }
        }

        function renderResult(data) {
            loadingState.style.display = 'none';
            container.style.display = 'flex';
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-10">No data found. Please upload documents first.</div>';
                return;
            }

            data.forEach((item, index) => {
                const badgeColor = mode === 'qb'
                    ? 'bg-blue-500/10 text-blue-400 border-blue-500/20'
                    : 'bg-purple-500/10 text-purple-400 border-purple-500/20';

                const card = document.createElement('div');
                card.className = `qa-item bg-[#1e1f20] border border-[#333537] rounded-2xl overflow-hidden transition-all duration-300 hover:border-[#4a4d51]`;
                card.style.animationDelay = `${index * 0.1}s`;
                card.dataset.mark = item.mark; // Fixed so buttons which use item.mark dataset can filter correctly
                card.dataset.rawmark = item.rawMark;

                card.innerHTML = `
                    <button class="w-full text-left p-5 sm:p-6 flex items-start justify-between gap-4 focus:outline-none group qa-toggle">
                        <div class="flex flex-col gap-2">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-semibold ${badgeColor} w-max border">
                                ${item.mark}
                            </span>
                            <h3 class="text-lg font-medium text-gray-100 group-hover:text-white transition-colors">
                                ${item.topic}
                            </h3>
                        </div>
                        <div class="shrink-0 w-8 h-8 rounded-full bg-[#2a2c2e] flex items-center justify-center text-gray-400 group-hover:text-white transition-all transform duration-300 icon-wrapper mt-1">
                            <i class="ph ph-caret-down"></i>
                        </div>
                    </button>
                    <div class="answer-wrapper">
                        <div class="answer-inner">
                            <div class="px-5 sm:px-6 pb-6 pt-2 text-gray-300 leading-relaxed border-t border-[#333537]/50 mt-2">
                                <div class="flex flex-col gap-4">
                                    <div class="prose prose-invert max-w-none text-sm sm:text-base w-full">
                                        ${item.answerHtml}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);

                // Add Toggle Behavior
                const toggleBtn = card.querySelector('.qa-toggle');
                toggleBtn.addEventListener('click', () => {
                    const wrapper = card.querySelector('.answer-wrapper');
                    const icon = card.querySelector('.icon-wrapper');
                    const isOpen = wrapper.classList.contains('open');

                    // Close all
                    document.querySelectorAll('.answer-wrapper').forEach(w => w.classList.remove('open'));
                    document.querySelectorAll('.icon-wrapper').forEach(i => i.style.transform = 'rotate(0deg)');
                    document.querySelectorAll('.qa-item').forEach(c => c.classList.remove('gemini-border-active'));

                    if (!isOpen) {
                        wrapper.classList.add('open');
                        icon.style.transform = 'rotate(180deg)';
                        card.classList.add('gemini-border-active');
                    }
                });
            });

            setTimeout(() => {
                mermaid.run({
                    nodes: document.querySelectorAll('.language-mermaid, .mermaid')
                });
            }, 100);
        }

        init();
    </script>
</body>

</html>
